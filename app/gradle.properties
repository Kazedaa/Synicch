# The system JDK on this machine is 26, which Android's build tooling does not
# support. Android Studio bundles JDK 21, so point Gradle at that rather than
# changing the system default.
org.gradle.java.home=/opt/android-studio/jbr

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
